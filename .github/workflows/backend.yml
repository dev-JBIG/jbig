name: Backend CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade 'pip>=26.2.2'
          pip install -r requirements.txt

      - name: Verify gunicorn runtime
        run: |
          source .venv/bin/activate
          python -c "import gunicorn; print('gunicorn', gunicorn.__version__)"

      - name: Run Django tests
        run: |
          source .venv/bin/activate
          python manage.py test

  deploy:
    name: Deploy Backend to Server
    needs: test
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    # 프로덕션 배포는 main 브랜치의 push 이벤트에서만 실행한다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create build archive
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, subprocess
          msg = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()
          sha = os.environ["COMMIT_SHA"]
          payload = {
              "commit": sha,
              "commit_short": sha[:7],
              "message": msg,
              "branch": os.environ["BRANCH_NAME"],
              "time": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("backend/VERSION.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          PY

          tar czf "backend-build-${RUN_ID}.tar.gz" \
            -C backend \
            --exclude='.venv' \
            --exclude='.git' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='media/*' \
            .

      - name: Upload build to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend-build-${{ github.run_id }}.tar.gz"
          target: "$HOME/releases/"

      - name: Deploy new release on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
          RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BACKEND_DEPLOY_PATH,RUN_ID
          script: |
            set -euo pipefail

            ARCHIVE_PATH="$HOME/releases/backend-build-${RUN_ID}.tar.gz"
            trap 'rm -f -- "$ARCHIVE_PATH"' EXIT

            HOME_REAL=$(realpath -m -- "$HOME")
            if [ -n "${BACKEND_DEPLOY_PATH:-}" ]; then
              APP_BASE_DIR=$(realpath -m -- "$HOME_REAL/${BACKEND_DEPLOY_PATH}")
              case "$APP_BASE_DIR" in
                "$HOME_REAL"/*) ;;
                *)
                  echo "Error: BACKEND_DEPLOY_PATH escapes HOME." >&2
                  exit 1
                  ;;
              esac
            else
              GUNICORN_WD=$(systemctl show -p WorkingDirectory --value gunicorn-jbig 2>/dev/null || true)
              if [ -z "$GUNICORN_WD" ]; then
                GUNICORN_EXEC=$(systemctl show -p ExecStart --value gunicorn-jbig 2>/dev/null || true)
                GUNICORN_WD=$(printf '%s\n' "$GUNICORN_EXEC" | grep -oE '/[^ ;]+/current' | head -n 1 || true)
              fi
              GUNICORN_WD="${GUNICORN_WD%/}"
              if [ -z "$GUNICORN_WD" ]; then
                echo "Error: BACKEND_DEPLOY_PATH secret is not configured and gunicorn-jbig path could not be detected." >&2
                exit 1
              fi
              if [ "${GUNICORN_WD%/current}" != "$GUNICORN_WD" ]; then
                APP_BASE_DIR=$(realpath -m -- "${GUNICORN_WD%/current}")
              else
                APP_BASE_DIR=$(realpath -m -- "$GUNICORN_WD")
              fi
              if [ -z "$APP_BASE_DIR" ] || [ "$APP_BASE_DIR" = "/" ] || [ "$APP_BASE_DIR" = "$HOME_REAL" ]; then
                echo "Error: Unsafe auto-detected backend deploy path." >&2
                exit 1
              fi
              if [ ! -d "$APP_BASE_DIR/shared" ] || [ ! -d "$APP_BASE_DIR/releases" ]; then
                echo "Error: Auto-detected backend deploy directory does not match expected shared/releases layout." >&2
                exit 1
              fi
              echo "Auto-detected backend release directory from gunicorn-jbig systemd unit."
            fi

            RELEASES_DIR="$APP_BASE_DIR/releases"
            SHARED_DIR="$APP_BASE_DIR/shared"
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            NEW_RELEASE="$RELEASES_DIR/$TIMESTAMP"

            # 디렉토리 생성
            mkdir -p -- "$RELEASES_DIR"
            mkdir -p -- "$SHARED_DIR/media"

            # 빌드 압축 해제
            mkdir -p -- "$NEW_RELEASE"
            tar xzf "$ARCHIVE_PATH" -C "$NEW_RELEASE"
            rm -f -- "$ARCHIVE_PATH"

            # 공유 디렉토리 심볼릭 링크 (media, .env 등)
            ln -sfn -- "$SHARED_DIR/media" "$NEW_RELEASE/media"
            ln -sfn -- "$SHARED_DIR/.env" "$NEW_RELEASE/.env"

            # 가상환경 설정 및 의존성 설치
            cd "$NEW_RELEASE"
            [ -d .venv ] || python3 -m venv .venv
            source .venv/bin/activate
            python -m pip install --upgrade 'pip>=26.2.2'
            pip install -r requirements.txt --no-cache-dir -q
            python -c "import gunicorn; print('gunicorn', gunicorn.__version__)"

            # Django 설정
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            # 새 릴리즈 활성화
            ln -sfn -- "$NEW_RELEASE" "$APP_BASE_DIR/current"

            # 서비스 재시작 (실패 시 배포 실패로 즉시 중단)
            sudo systemctl restart gunicorn-jbig
            if systemctl cat jbig-arena-worker.service >/dev/null 2>&1; then
              sudo systemctl restart jbig-arena-worker
            fi
            sudo systemctl reload nginx

            # 오래된 릴리즈 정리 (14자리 타임스탬프 디렉토리만 대상으로 최근 5개 유지)
            find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d -regextype posix-extended -regex '.*/[0-9]{14}$' -printf '%f\0' \
              | sort -z -rn \
              | tail -z -n +6 \
              | while IFS= read -r -d '' old_rel; do
                  sudo rm -rf -- "$RELEASES_DIR/$old_rel"
                done

            echo "Deployed new backend version: $TIMESTAMP"
