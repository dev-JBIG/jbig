name: Backend CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade 'pip>=26.2.2'
          pip install -r requirements.txt

      - name: Verify gunicorn runtime
        run: |
          source .venv/bin/activate
          python -c "import gunicorn; print('gunicorn', gunicorn.__version__)"

      - name: Run Django tests
        run: |
          source .venv/bin/activate
          python manage.py test

  deploy:
    name: Deploy Backend to Server
    needs: test
    # PR 이벤트에서는 테스트 검증(test)만 수행하고, 실제 서버 배포는 main 푸시 또는 main 수동 실행에서만 진행한다.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build archive
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, subprocess
          msg = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()
          sha = os.environ["COMMIT_SHA"]
          payload = {
              "commit": sha,
              "commit_short": sha[:7],
              "message": msg,
              "branch": os.environ["BRANCH_NAME"],
              "time": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("backend/VERSION.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          PY

          tar czf /tmp/backend-build.tar.gz \
            -C backend \
            --exclude='.venv' \
            --exclude='.git' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='media/*' \
            .
          mv /tmp/backend-build.tar.gz backend-build.tar.gz

      - name: Upload build to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend-build.tar.gz"
          target: "/tmp/"

      - name: Deploy new release on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BACKEND_DEPLOY_PATH
          script: |
            set -euo pipefail

            if [ -n "${BACKEND_DEPLOY_PATH:-}" ]; then
              APP_BASE_DIR="$HOME/${BACKEND_DEPLOY_PATH}"
            else
              GUNICORN_WD=$(systemctl show -p WorkingDirectory --value gunicorn-jbig 2>/dev/null || true)
              if [ -z "$GUNICORN_WD" ]; then
                GUNICORN_EXEC=$(systemctl show -p ExecStart --value gunicorn-jbig 2>/dev/null || true)
                GUNICORN_WD=$(printf '%s\n' "$GUNICORN_EXEC" | grep -oE '/[^ ;]+/current' | head -n 1 || true)
              fi
              GUNICORN_WD="${GUNICORN_WD%/}"
              if [ -z "$GUNICORN_WD" ]; then
                echo "Error: BACKEND_DEPLOY_PATH secret is not configured and gunicorn-jbig path could not be detected." >&2
                exit 1
              fi
              if [ "${GUNICORN_WD%/current}" != "$GUNICORN_WD" ]; then
                APP_BASE_DIR="${GUNICORN_WD%/current}"
              else
                APP_BASE_DIR="$GUNICORN_WD"
              fi
              if [ "$APP_BASE_DIR" = "/" ] || [ "$APP_BASE_DIR" = "$HOME" ] || [ ! -d "$APP_BASE_DIR/shared" ] || [ ! -d "$APP_BASE_DIR/releases" ]; then
                echo "Error: Auto-detected backend directory does not match expected shared/releases layout." >&2
                exit 1
              fi
              echo "Auto-detected backend release directory from gunicorn-jbig systemd unit."
            fi

            RELEASES_DIR="$APP_BASE_DIR/releases"
            SHARED_DIR="$APP_BASE_DIR/shared"
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            NEW_RELEASE="$RELEASES_DIR/$TIMESTAMP"

            # 디렉토리 생성
            mkdir -p "$RELEASES_DIR"
            mkdir -p "$SHARED_DIR/media"

            # 빌드 압축 해제
            mkdir -p "$NEW_RELEASE"
            tar xzf "/tmp/backend-build.tar.gz" -C "$NEW_RELEASE"
            rm -f "/tmp/backend-build.tar.gz"

            # 공유 디렉토리 심볼릭 링크 (media, .env 등)
            ln -sfn "$SHARED_DIR/media" "$NEW_RELEASE/media"
            ln -sfn "$SHARED_DIR/.env" "$NEW_RELEASE/.env"

            # 가상환경 설정 및 의존성 설치
            cd "$NEW_RELEASE"
            [ -d .venv ] || python3 -m venv .venv
            source .venv/bin/activate
            python -m pip install --upgrade 'pip>=26.2.2'
            pip install -r requirements.txt --no-cache-dir -q
            python -c "import gunicorn; print('gunicorn', gunicorn.__version__)"

            # Django 설정
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            # 새 릴리즈 활성화
            ln -sfn "$NEW_RELEASE" "$APP_BASE_DIR/current"

            # 서비스 재시작
            sudo systemctl restart gunicorn-jbig || echo "Gunicorn restart failed"
            if systemctl cat jbig-arena-worker.service >/dev/null 2>&1; then
              sudo systemctl restart jbig-arena-worker
            fi
            sudo systemctl reload nginx || echo "Nginx reload failed"

            # 오래된 릴리즈 정리 (최근 5개만 유지)
            cd "$RELEASES_DIR"
            ls -t | tail -n +6 | xargs -r sudo rm -rf

            echo "Deployed new backend version: $TIMESTAMP"
