name: Frontend CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build
        env:
          CI: false
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
          REACT_APP_DEFAULT_NOTION_PAGE_ID: ${{ secrets.REACT_APP_DEFAULT_NOTION_PAGE_ID }}
          REACT_APP_SERVER_HOST: ${{ secrets.REACT_APP_SERVER_HOST }}
          REACT_APP_SERVER_PORT: ${{ secrets.REACT_APP_SERVER_PORT }}
          REACT_APP_USERID_SECRET: ${{ secrets.REACT_APP_USERID_SECRET }}
          REACT_APP_TURNSTILE_SITE_KEY: ${{ secrets.REACT_APP_TURNSTILE_SITE_KEY }}
          REACT_APP_MEDIA_BASE_URL: https://cdn.jbig.co.kr

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

  deploy:
    name: Deploy Frontend to Server
    needs: ci
    # PR 이벤트에서는 빌드·테스트 검증(ci)만 수행하고, 실제 서버 배포는 main 푸시 또는 main 수동 실행에서만 진행한다.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build

      - name: Create build archive
        run: |
          tar czf /tmp/frontend-build.tar.gz -C build .
          mv /tmp/frontend-build.tar.gz frontend-build.tar.gz

      - name: Upload build to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend-build.tar.gz"
          target: "$HOME/releases/"

      - name: Deploy new release on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          FRONTEND_DEPLOY_PATH: ${{ secrets.FRONTEND_DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: FRONTEND_DEPLOY_PATH
          script: |
            set -euo pipefail

            if [ -z "${FRONTEND_DEPLOY_PATH:-}" ]; then
              echo "Error: FRONTEND_DEPLOY_PATH secret is not configured." >&2
              exit 1
            fi

            APP_BASE="$HOME/${FRONTEND_DEPLOY_PATH}"
            APP_CURRENT="$APP_BASE/current"
            RELEASES_DIR="$HOME/releases"
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            NEW_RELEASE="$APP_BASE/$TIMESTAMP"

            mkdir -p "$NEW_RELEASE"
            tar xzf "$RELEASES_DIR/frontend-build.tar.gz" -C "$NEW_RELEASE"
            rm -f "$RELEASES_DIR/frontend-build.tar.gz"

            ln -sfn "$NEW_RELEASE" "$APP_CURRENT"

            # 오래된 릴리즈 정리 (최근 5개만 유지)
            cd "$APP_BASE"
            ls -dt -- */ 2>/dev/null | grep -v '^current/$' | tail -n +6 | xargs -r rm -rf

            sudo systemctl reload nginx
            echo "Deployed new frontend version: $TIMESTAMP"
