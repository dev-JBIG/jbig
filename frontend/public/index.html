<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/JBIG-logo-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jbig-color-mode') || 'auto';
          var pref = (stored === 'light' || stored === 'dark' || stored === 'dark_dimmed' || stored === 'auto') ? stored : 'auto';
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var colorMode = pref === 'dark_dimmed' ? 'dark' : pref;
          var darkTheme = pref === 'dark' ? 'dark' : 'dark_dimmed';
          var resolvedDark = colorMode === 'dark' || (colorMode === 'auto' && sysDark);
          var root = document.documentElement;
          root.setAttribute('data-color-mode', colorMode);
          root.setAttribute('data-light-theme', 'light');
          root.setAttribute('data-dark-theme', darkTheme);
          root.style.colorScheme = resolvedDark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', resolvedDark ? (darkTheme === 'dark' ? '#0d1117' : '#212830') : '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Data are profoundly dumb."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JBIG" />
    <meta property="og:title" content="JBIG" />
    <meta property="og:description" content="Data are profoundly dumb." />
    <meta property="og:url" content="https://jbig.co.kr/" />
    <meta property="og:image" content="https://jbig.co.kr/JBIG-logo-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JBIG" />
    <meta name="twitter:description" content="Data are profoundly dumb." />
    <meta name="twitter:image" content="https://jbig.co.kr/JBIG-logo-1200x630.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/JBIG-logo-192.png" />

    <link rel="icon" sizes="192x192" href="%PUBLIC_URL%/JBIG-logo-192.png" />

    <title>JBIG</title>

  </head>
  <body>
    <noscript>JBIG Cafe works with JavaScript enabled.</noscript>
    <div id="root"></div>
  </body>
</html>
