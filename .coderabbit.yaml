# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ko-KR
early_access: false

reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  review_status: true
  poem: false
  in_progress_fortune: false
  abort_on_close: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  path_filters:
    - "!frontend/package-lock.json"
    - "!frontend/build/**"
    - "!frontend/**/*.css.backup"
    - "!frontend/public/*.png"
    - "!frontend/public/*.ico"
    - "!backend/**/migrations/**"
    - "!backend/staticfiles/**"
    - "!backend/**/__pycache__/**"
    - "!**/*.min.*"

  path_instructions:
    # === Frontend ===
    - path: "frontend/src/API/**"
      instructions: |
        - `frontend/src/API/auth.ts`의 Web Locks(`navigator.locks`) 기반 단일 토큰 갱신, `jbig-session` 원자적 저장, `SessionChangedError` 처리가 손상되지 않았는지 확인하세요.
        - `frontend/src/API/client.ts`에서 `BASE_URL/api/` 경로에 한정해 Bearer 토큰을 주입하고 401 재시도를 1회로 제한하는 보안 가드가 유지되는지 점검하세요(외부 URL이나 presigned URL로 Authorization 헤더가 유출되면 안 됩니다).
        - Django REST API 엔드포인트(`backend/`)와 URL trailing slash(`/`) 및 응답 필드 스키마가 일치하는지 확인하세요.
        - `frontend/src/API/arena.ts`의 `Idempotency-Key` 헤더와 `AbortSignal` 전달이 유지되는지 확인하세요.
    - path: "frontend/src/Components/Posts/**"
      instructions: |
        - 마크다운 렌더링에서 `rehype-sanitize` 및 `safeMarkdown` 정책이 우회되지 않고 XSS 방어가 유지되는지 확인하세요.
        - 비로그인 댓글의 Cloudflare Turnstile 검증 및 권한 게이트 첨부파일 다운로드(`downloadGatedAttachment`) 흐름이 깨지지 않았는지 점검하세요.
        - 게시글 상세/작성/수정(`PostDetail`, `PostWrite`)에서 `recruitment_info`, `tag`, 수정 모드 상태 복원, 첨부파일 스토리지 키 추출(`extractKeyFromUrl`) 로직의 경계 조건을 확인하세요.
    - path: "frontend/src/Components/Profile/**"
      instructions: |
        - 사용자 HTML 프로필 렌더링 `<iframe>`에 `sandbox=""` 격리 속성과 새니타이징이 유지되는지 최우선으로 확인하세요.
        - 비동기 데이터 페칭에서 cleanup/취소 처리 누락으로 영구 로딩이나 언마운트 후 상태 갱신이 발생하지 않는지 점검하세요.
    - path: "frontend/src/Components/Competitions/**"
      instructions: |
        - Arena 제출의 `Idempotency-Key` 유지 및 재시도 처리, 업로드 진행률 표시, 모바일 화면의 긴 닉네임 줄바꿈/반응형 레이아웃을 확인하세요.
    - path: "frontend/src/Components/**"
      instructions: |
        - React Hooks 규칙(의존성 배열, effect cleanup)과 모달/다이얼로그 콜백 중복 호출 방지(`AlertModal`/`AlertContext` 등)를 점검하세요.
        - 루트 `DESIGN.md` 가이드라인을 기준으로 `@primer/react` 및 `@primer/primitives` 디자인 토큰/CSS 변수 일관성을 유지하고 전역 CSS 충돌이 없는지 확인하세요.
        - 접근성(키보드 조작, 시맨틱 HTML, `aria-*` 속성), `loading="lazy" decoding="async"` 이미지 렌더링, 모바일/데스크톱 반응형 깨짐 여부를 확인하세요.
    - path: "frontend/src/**/*.css"
      instructions: |
        - 루트 `DESIGN.md`의 코너 라운드 규칙을 반드시 확인하세요: 하드코딩 `border-radius` px(`2px`, `3px`, `4px`, `6px`, `8px`, `12px` 등) 사용 금지. 일반 카드·배너·사이드바·버튼·인풋은 `var(--radius-md)`(6px), 작은 칩/배지는 `var(--radius-sm)`(3px), 플로팅 모달·드롭다운 오버레이·팝업만 `var(--radius-lg)`(12px)를 사용해야 합니다.
        - 원시 hex 색상 하드코딩 대신 Primer 시맨틱 토큰(`--fgColor-*`, `--bgColor-*`, `--borderColor-*`, `--overlay-bgColor`) 또는 `index.css` 브리지 토큰을 사용해 라이트/다크 모드를 모두 지원하는지 확인하세요.
        - `frontend/src/index.css`의 전역 `img { dynamic-range-limit: standard; }` 규칙이 제거되거나 무효화되지 않았는지 확인하세요.

    # === Backend ===
    - path: "backend/boards/**"
      instructions: |
        - 게시판 3축 권한 매트릭스(read_permission: all/member/author/staff, post_permission, comment_permission) 및 PostQuerySet.visible_for_user / readable_for_user 우회 가능성을 최우선으로 점검하세요.
        - 비공개·회원전용·작성자전용(author)·스태프전용·사유서(JUSTIFICATION_LETTER) 게시글에서 R2/CDN 공개 URL이 노출되지 않고 is_post_media_gated()를 통해 다운로드 엔드포인트 또는 서명 토큰 스트림으로 게이팅되는지 확인하세요.
        - 파일 업로드/수정/삭제 시 uploads/Y/m/d/<user_id>/... 소유권 검증과 타 게시글·임시저장(Draft) 참조 여부(_is_upload_referenced)를 확인하세요.
        - JBIG 익명성 모델(is_anonymous=True는 비로그인 외부 방문자에게만 익명화, 로그인 회원은 실명 표시)이 의도대로 유지되는지 확인하세요.
        - 목록/상세 쿼리에서 select_related / prefetch_related / Count annotation 누락으로 인한 N+1 쿼리를 점검하세요.
    - path: "backend/recruitments/**"
      instructions: |
        - 운영 DB는 PostgreSQL(Supabase), CI는 SQLite입니다. select_for_update()를 nullable FK(예: Post.author)와 select_related()로 함께 사용할 때 PostgreSQL NotSupportedError(FOR UPDATE on outer join)가 발생하지 않도록 of=('self',) 사용 여부를 반드시 확인하세요.
        - 게시판 조회 권한 게이트(readable_for_user) 및 지원서/연락처(contact_info)/recruiter_note 노출 권한을 점검하세요.
        - 정원(max_members) 및 accepted_count 동시성·트랜잭션 정합성을 확인하세요.
    - path: "backend/competitions/**"
      instructions: |
        - 보안 경계: HTTP 뷰(views.py, services.py)가 scoring.py 또는 data_setup.py를 절대 import하지 않아야 하며, private_rmse는 FINALIZED 이전 API·Admin 어디에도 노출되면 안 됩니다.
        - 파일 저장·읽기 시 ARENA_PARTICIPANT_ROOT / ARENA_SUBMISSION_ROOT / ARENA_GRADING_ROOT 격리와 권한 모드(0640/0600), 경로 탈출 방지를 확인하세요.
        - Idempotency-Key 재전송, KST 일일 할당량(DailyQuota) 차감 시점(검증 실패 시 미차감), worker_token 리스 펜싱, 장기 실행 워커의 DB 커넥션 관리(close_old_connections)를 점검하세요.
    - path: "backend/users/**"
      instructions: |
        - 인증/비밀번호 재설정/이메일 인증에서 계정 열거 방지(anti-enumeration), 스로틀링, 토큰 재사용·동시성, AUTH_PASSWORD_VALIDATORS 적용, CSPRNG(secrets) 사용을 확인하세요.
        - Refresh 토큰 회전 및 블랙리스트 처리 시 트랜잭션·경쟁 상태를 점검하세요.
        - profile_html 저장 시 크기 제한 및 프론트엔드 샌드박스 가정 위반 여부를 확인하세요.
    - path: "backend/jbig_backend/**"
      instructions: |
        - settings.py 보안 설정(DEBUG, ALLOWED_HOSTS, CORS, SECRET_KEY, HTTPS/HSTS)과 IS_LOCAL 분기 안전성을 점검하세요.
        - storage.py / local_upload.py의 경로 순회(path traversal) 방지와 R2 공개/비공개 경계를 확인하세요.
        - notion.py 캐시 동시성·예외 처리 및 SiteSettings / PopupViewSet 접근 권한 일관성을 확인하세요.

    # === CI/CD ===
    - path: ".github/workflows/**"
      instructions: |
        - 프로덕션 배포(`deploy`) job이 반드시 `push` 이벤트의 `refs/heads/main`에서만 실행되도록 가드가 유지되는지 확인하세요.
        - `FRONTEND_DEPLOY_PATH`와 `BACKEND_DEPLOY_PATH` 시크릿이 서로 혼동되지 않는지 확인하세요.
        - GitHub Actions 보안(권한 최소화, 시크릿 노출 방지, 셸 인젝션 방지, 안전한 액션 버전 사용)을 점검하세요.

  tools:
    eslint:
      enabled: true
    ruff:
      enabled: true
    flake8:
      enabled: false
    pylint:
      enabled: false
    languagetool:
      enabled: false
    markdownlint:
      enabled: false
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    semgrep:
      enabled: true
    opengrep:
      enabled: true
    ast-grep:
      enabled: true
      essential_rules: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    github-checks:
      enabled: true

chat:
  auto_reply: true
